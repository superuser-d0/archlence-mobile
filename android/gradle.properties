org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# AGP 9 compiles Kotlin itself, and the Flutter template turns that off.
#
# It has to be ON here. `share_plus` 13 stopped applying the Kotlin Gradle
# Plugin when AGP is 9 or newer — which is the whole reason for moving to it,
# since Flutter now warns that plugins applying KGP will stop building. With
# built-in Kotlin ALSO off, nothing compiles the plugin's Kotlin against its
# own source set: `Share.kt` fails to resolve `SharePlusPendingIntent`, a
# class sitting in the file next to it. Neither half is wrong on its own; the
# combination leaves the plugin with no Kotlin compiler at all.
android.builtInKotlin=true
