name: archlence_mobile
description: "Archlence - local-first personal finance, Android client."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Money must never touch a binary float. Mirrors utils/financial_decimal.py.
  decimal: ^3.2.4

  # Encrypted local store + the key that protects it.
  drift: ^2.28.2
  sqlite3_flutter_libs: ^0.5.42
  # Used DIRECTLY, not only through drift: a backup is a SQLite-level copy of
  # the database, which needs sqlite3's own online-backup API rather than a
  # copy of the file's bytes.
  sqlite3: ^3.5.2
  # Where the database's encryption key lives. Every construction of it in
  # `lib/` passes `AndroidOptions(resetOnError: false)`, and that argument is
  # not decoration: 11 changed the default to TRUE, which erases the whole
  # store when a read fails. The store holds the key the entire database is
  # encrypted under, so a silent reset is not a recovered error — it is every
  # account, transaction and holding on the device, permanently unreadable.
  flutter_secure_storage: ^11.0.0
  cryptography: ^2.7.0

  # Charts (donut + income/expense trend).
  fl_chart: ^1.1.1

  path_provider: ^2.1.6
  path: ^1.9.1
  intl: ^0.20.2
  local_auth: ^3.0.2
  archive: ^4.2.0

  # Getting a backup OFF the phone and a backup file back ON to it. Both go
  # through the platform's own pickers rather than a folder this app writes
  # into: since Android 11 an app cannot hand another app a path, and a backup
  # the user cannot move somewhere else is not a backup.
  #
  # `file_selector` rather than `file_picker`. That began as a constraint —
  # `file_picker` needs `win32: ^6`, which `flutter_secure_storage` 9 forbade
  # through its Windows sibling, compiled even for an Android build. The
  # constraint is gone now that the key store is on 11, and the choice
  # stands anyway: `file_selector` does what this app asks of it.
  #
  # `share_plus` had to move for the same knot, in the other direction: 12
  # applies the Kotlin Gradle Plugin, which Flutter now warns will stop
  # building, and every release that fixes it needs the same `win32: ^6`.
  share_plus: ^13.3.0
  file_selector: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.28.2
  build_runner: ^2.9.0
  local_auth_platform_interface: ^1.1.0

flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-400.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-500.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-600.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-700.ttf
          weight: 700
