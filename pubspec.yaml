name: archlence_mobile
description: "Archlence - local-first personal finance, Android client."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  # Money must never touch a binary float. Mirrors utils/financial_decimal.py.
  decimal: ^3.2.4

  # Encrypted local store + the key that protects it.
  drift: ^2.28.2
  sqlite3_flutter_libs: ^0.5.42
  flutter_secure_storage: ^9.2.4
  cryptography: ^2.7.0

  # Charts (donut + income/expense trend).
  fl_chart: ^1.1.1

  path_provider: ^2.1.6
  path: ^1.9.1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.28.2
  build_runner: ^2.9.0

flutter:
  uses-material-design: true

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-400.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-500.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-600.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-700.ttf
          weight: 700
