include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Developer utilities that print vectors to stdout by design.
    - tool/**
    # Generated by build_runner; not ours to lint.
    - "**/*.g.dart"
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
