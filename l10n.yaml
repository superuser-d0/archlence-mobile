# The label layer. `flutter gen-l10n` reads the ARB files under `arb-dir` and
# writes `AppLocalizations` beside them; the output is checked in, like the
# drift codegen, so a clone builds without a generation step.
#
# The TEMPLATE is English, not Turkish. It is the file that carries the
# descriptions and the placeholder types, and it is what a missing Turkish
# entry falls back to — the same reason the services carry a developer-facing
# English message beside their error code.
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
nullable-getter: false
